[project]
name = "awsome-ai-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "e2b-code-interpreter>=2.9.0",
]

[project.optional-dependencies]
# NOTE: The version ranges below define broad compatibility for users.
# For a strictly reproducible and tested environment, always use `uv.lock`.

frameworks = [
    "pydantic-ai>=2.30.0,<3.0.0",
    "langgraph>=1.2.0,<2.0.0",
    "openai-agents>=0.20.0,<0.21.0"
]
core = [
    "jupyter",
    "ipykernel",
    "pydantic>=2.0.0",
    "pandas",
    "openai",
    "nest-asyncio>=1.5.0"
]
beginner = [
    "awsome-ai-agents[core]"
]
browser = [
    "playwright>=1.40.0,<2.0.0"
]
intermediate = [
    "awsome-ai-agents[core]",
    "langchain",
    "langchain-openai",
    "dspy-ai"
]
advanced = [
    "awsome-ai-agents[intermediate]",
    "autogen-agentchat==0.7.5",
    "autogen-ext[openai]==0.7.5",
    # Course 30 still imports the separately maintained classic `autogen` namespace.
    "autogen==0.14.1",
    "crewai",
    "agentops",
    "mcp",
    "chromadb",
    "temporalio",
    "anthropic",
    "matplotlib",
    "numpy",
    "tqdm",
    "umap-learn",
    "opentelemetry-api",
    "opentelemetry-sdk"
]
contributor = [
    "pytest",
    "nbclient",
    "nbformat",
    "nbconvert",
]

[tool.setuptools]
py-modules = []
packages = ["awsome_agents"]
